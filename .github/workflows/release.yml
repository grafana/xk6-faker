name: Release

permissions: {}

on:
  push:
    tags: ["v*.*.*"]

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.go-versions.outputs.current }}
    steps:
      - name: Resolve Go versions
        id: go-versions
        uses: grafana/k6-ci/.github/actions/go-versions@7dc7a71c57a30eddd3f1591ee0cc5abaeedafa14 # v0.5.4

  release:
    name: Release
    needs: configure
    uses: grafana/xk6/.github/workflows/extension-release.yml@4f39ba602a7a442b960e84f725d26cc2a9a24326 # v1.4.14
    permissions:
      contents: write
    with:
      go-version: ${{ needs.configure.outputs.current }}
      os: '["linux", "windows", "darwin"]'
      arch: '["amd64", "arm64"]'
      k6-version: "v2.0.0-rc1"
      xk6-version: "1.4.1"
